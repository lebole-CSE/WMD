<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

      <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>

        <a href="feedback.html">Feedback</a>

    <header>
         <img src="SciBrilliance Logo.png" alt="SciBrilliance Logo" class="logo">
        <h1>Feedback</h1>
        <p>We would like to hear what you think about our science website.</p>
    </header>

    <main>

        <section>
            <h2>Send Your Feedback</h2>

            <form onsubmit="sendFeedback(event)">

                <label for="name">Name:</label><br>
                <input type="text" id="name"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email"><br><br>

                <label for="feedback">Your Feedback:</label><br>
                <textarea id="feedback" rows="6" cols="30"></textarea><br><br>

                <input type="submit" value="Submit">

            </form>
        </section>

    </main>

   <footer>
  
        <div class="footer-section socials-section">
            <h3>Connect With Us</h3>
    
            <div class="social-links">
                
                <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">Facebook</a>
                <a href="https://x.com/" target="_blank" aria-label="Twitter">Twitter</a>
                <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">Instagram</a>
                <a href="https://www.youtube.com/youtube" target="_blank" aria-label="YouTube">YouTube</a>
            </div>
        </div>
    
    
    <hr class="footer-divider">
    <p>&copy; 2026 SciBrilliance. All rights reserved.</p>
</footer>

</body>
</html>
